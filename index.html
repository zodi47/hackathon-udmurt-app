        <section id="register-screen" hidden>

        </section>

        <section id="login-screen" hidden>
            <p>Вход</p>
            <input id="login-name" type="text" placeholder="Имя пользователя">
            <input id="login-password" type="password" placeholder="Пароль">
            <p id="login-error"></p>
            <button id="login-button">Войти</button>
            <button id="login-back">Назад</button>
