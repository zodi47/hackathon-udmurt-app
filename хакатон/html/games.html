<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Игры</title>
</head>
<body>
    <header>
        
    </header>
    <nav>

    </nav>
    <main>
        <h1>Игры</h1>

        <section id="start-screen">
            <p>Выберите игру для повторения:</p>
            <div>
                <button id="select-translate">Выбери перевод</button>
            </div>
            <button id="to-main">На главную</button>
        </section>

        <section id="select-screen" hidden>
            <p>Выберите тему:</p>
            <div id="buttons"></div>
            <button id="to-start-screen">Назад</button>
        </section>

        <section id="game-screen" hidden>
            <button id="close-btn">✕</button>
            <p>Переведите на русский</p>
            <p id="word"></p>
            <p id="count"></p>
            <div id="options"></div>
            <button id="next" hidden>Далее</button>
        </section>

        <section id="end-game-screen" hidden>
            <p id="result-text"></p>
            <p id="result-score"></p>
            <button id="play-again">Играть ещё</button>
            <button id="to-themes">К списку тем</button>
        </section>

    </main>
    <footer>
        
    </footer>

    <script type="module" src="../js/games.js"></script>
</body>
</html>
